# Publicação no GitHub Pages.
#
# Publica no push da main, mais disparo manual.
#
# Só o workflow não põe nada no ar: é preciso, uma vez, apontar o Pages para
# "GitHub Actions" como Source. Sem isso o job termina em verde e o site continua
# indisponível. E a ordem importa: mudar o Pages de legacy para workflow DEPOIS
# que o workflow já rodou faz o build antigo sobrescrever o novo, e tudo responde
# 404 com o deploy verde.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez, sem cancelar a que já está em andamento.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # O prefixo tem de casar com o nome do repositório, porque o Pages serve o
      # projeto em /<repositório>/. Vem do próprio contexto para não sair de sincronia
      # se o repositório for renomeado.
      - name: Build estático
        run: pnpm build
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
