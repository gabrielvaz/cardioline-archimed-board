# Publicação no GitHub Pages.
#
# DISPARO MANUAL, e o Pages está DESLIGADO neste repo por decisão de 09/09/2026:
# o deck fica versionado no GitHub e não publicado na web. O workflow segue aqui
# porque é o caminho de volta, não porque roda.
#
# Para republicar são dois passos, nesta ordem:
#   gh api -X POST repos/<owner>/<repo>/pages -f build_type=workflow
#   gh workflow run pages.yml
#
# A ordem importa: apontar o Pages para workflow DEPOIS que o workflow já rodou
# faz o build antigo sobrescrever o novo, e tudo responde 404 com deploy verde.
#
# Um gatilho em push aqui só produziria run vermelho a cada commit, porque o
# deploy falha sem site de Pages configurado.
name: Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez, sem cancelar a que já está em andamento.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Sem `version`: ela vem do `packageManager` do package.json. Declarar nos
      # dois lugares faz o action falhar com "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # O prefixo tem de casar com o nome do repositório, porque o Pages serve o
      # projeto em /<repositório>/. Vem do próprio contexto para não sair de sincronia
      # se o repositório for renomeado.
      - name: Build estático
        run: pnpm build
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
